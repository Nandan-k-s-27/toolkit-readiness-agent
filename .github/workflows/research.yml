name: Research Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name to research (default: Slack. Use 'all' for full 100)"
        required: false
        default: "Slack"
      llm_provider:
        description: "LLM Provider: gemini or anthropic"
        required: false
        default: "gemini"
      search_backend:
        description: "Search backend: direct (DuckDuckGo) or composio"
        required: false
        default: "direct"
  schedule:
    # Re-run the full pipeline weekly (Sundays at 02:00 UTC)
    - cron: "0 2 * * 0"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pass1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'gemini' }}
          SEARCH_BACKEND: ${{ github.event.inputs.search_backend || 'direct' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          APP_FLAG=""
          TARGET_APP="${{ github.event.inputs.app }}"
          if [ -n "$TARGET_APP" ] && [ "$TARGET_APP" != "all" ]; then
            APP_FLAG="--app $TARGET_APP"
          fi
          python research.py pass1 $APP_FLAG --workers 2

      - name: Run pass2
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: ${{ github.event.inputs.llm_provider || 'gemini' }}
          SEARCH_BACKEND: ${{ github.event.inputs.search_backend || 'direct' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
        run: |
          APP_FLAG=""
          TARGET_APP="${{ github.event.inputs.app }}"
          if [ -n "$TARGET_APP" ] && [ "$TARGET_APP" != "all" ]; then
            APP_FLAG="--app $TARGET_APP"
          fi
          python research.py pass2 $APP_FLAG --workers 2

      - name: Analyze patterns
        run: python analyze.py

      - name: Build results page
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: python build_page.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_number }}
          path: |
            results_pass1.json
            results_final.json
            human_queue.json
            patterns.json
            index.html
          retention-days: 30

      - name: Commit results back to repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_pass1.json results_final.json human_queue.json patterns.json index.html || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): refresh research results [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Notice: Push skipped (enable 'Read and write permissions' in repository Settings > Actions > General to allow automated commits)"
          fi
