name: Research Agent Pipeline

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Single app name (leave blank for all 100)"
        required: false
        default: ""
      search_backend:
        description: "Search backend: composio or direct"
        required: false
        default: "direct"
  schedule:
    # Re-run the full pipeline weekly (Sundays at 02:00 UTC)
    - cron: "0 2 * * 0"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pass1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          SEARCH_BACKEND: ${{ github.event.inputs.search_backend || 'direct' }}
        run: |
          APP_FLAG=""
          if [ -n "${{ github.event.inputs.app }}" ]; then
            APP_FLAG="--app ${{ github.event.inputs.app }}"
          fi
          python research.py pass1 $APP_FLAG --workers 8

      - name: Run pass2
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          SEARCH_BACKEND: ${{ github.event.inputs.search_backend || 'direct' }}
        run: |
          APP_FLAG=""
          if [ -n "${{ github.event.inputs.app }}" ]; then
            APP_FLAG="--app ${{ github.event.inputs.app }}"
          fi
          python research.py pass2 $APP_FLAG

      - name: Analyze patterns
        run: python analyze.py

      - name: Build results page
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: python build_page.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.run_number }}
          path: |
            results_pass1.json
            results_final.json
            human_queue.json
            patterns.json
            index.html
          retention-days: 30

      - name: Commit results back to repo
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results_pass1.json results_final.json human_queue.json patterns.json index.html || true
          git diff --staged --quiet || git commit -m "chore(data): refresh research results [skip ci]"
          git push
